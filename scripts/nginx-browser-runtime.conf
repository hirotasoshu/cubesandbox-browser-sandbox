upstream vnc_proxy {
    server 127.0.0.1:6901;
}

server {
    listen 9000;

    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Methods * always;
    add_header Access-Control-Allow-Headers * always;
    add_header Access-Control-Expose-Headers * always;
    add_header Access-Control-Allow-Credentials true always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    location /ping {
        add_header Content-Type application/json;
        return 200 '{"status": "ok", "message": "pong"}';
    }

    location /websockify {
        proxy_http_version 1.1;
        proxy_pass http://vnc_proxy/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 360s;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /novnc/ {
        proxy_pass http://localhost:6901/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /cdp/ {
        proxy_pass http://localhost:9222/;
        proxy_set_header Host localhost:9222;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        set $websocket_host $http_host;
        set $websocket_protocol ws;
        if ($http_x_forwarded_host) {
            set $websocket_host $http_x_forwarded_host;
        }
        if ($http_x_forwarded_proto = "https") {
            set $websocket_protocol wss;
        }
        if ($scheme = "https") {
            set $websocket_protocol wss;
        }

        sub_filter 'ws://localhost:9222' '$websocket_protocol://$websocket_host/cdp';
        sub_filter_once off;
        sub_filter_types application/json;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:8931/mcp;
        proxy_set_header Host localhost:8931;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 10000;

    location / {
        proxy_pass http://127.0.0.1:11000;
        proxy_set_header Host localhost:11000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        set $websocket_host $http_host;
        set $websocket_protocol ws;
        if ($http_x_forwarded_host) {
            set $websocket_host $http_x_forwarded_host;
        }
        if ($http_x_forwarded_proto = "https") {
            set $websocket_protocol wss;
        }
        if ($scheme = "https") {
            set $websocket_protocol wss;
        }

        sub_filter 'ws://localhost:11000' '$websocket_protocol://$websocket_host';
        sub_filter 'ws://127.0.0.1:11000' '$websocket_protocol://$websocket_host';
        sub_filter_once off;
        sub_filter_types application/json;
    }
}
